<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #0066cc;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 5px;

            background: #0066cc;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #0066cc;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form action="/admin/login" method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
